name: Hugo build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install Hugo v0.168.0 extended
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz
          curl -fsSLO https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_checksums.txt
          grep 'hugo_extended_0.168.0_linux-amd64.tar.gz' hugo_0.168.0_checksums.txt | sha256sum -c -
          tar -xzf hugo_extended_0.168.0_linux-amd64.tar.gz hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build example site without warnings
        run: hugo --gc -s exampleSite --minify --panicOnWarning
